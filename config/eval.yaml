# ============================================================================
# EVALUATION config  (used by:  python evaluate.py --config config/eval.yaml)
#
# Closed-loop evaluation on the official nuPlan val14 benchmark (1118 scenarios).
# Scenarios are sharded across workers by token, and each worker opens only the
# nuPlan dbs holding its shard (via config/val14_token2db.json), so per-worker
# build is cheap. Prints a running mean and writes per-scenario metrics.
#
# Self-contained -- edit paths here. RNG-cluster paths are filled in below.
# ============================================================================
seed: 17
ray: {address: null}

factory:
  path: flow_planner.critic_rl.factory:NuPlanHydraFactory
  kwargs:
    config_dir: /fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/special/tfx-901/ruh1syv/nuplan-devkit/nuplan/planning/script/config/simulation
    num_candidates: 16
    base_seed: 17
    max_steps: null
    data_root: /fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset
    maps_root: /fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/maps
    output_dir: /tmp/eval/nuplan
    exp_root: /tmp/eval
    # execution_horizon here = how many steps the controller commits per replan.
    # (The critic's look-ahead is a separate knob: evaluate.visible_horizon.)
    execution_horizon: 1
    overrides:
      - +simulation=closed_loop_nonreactive_agents
      - planner=flow_planner
      - planner.flow_planner.config_path=/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/special/tfx-901/ruh1syv/ckpts/flow-planner/model_config.yaml
      - planner.flow_planner.ckpt_path=/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/special/tfx-901/ruh1syv/ckpts/flow-planner/model.pth
      - scenario_builder=nuplan
      - scenario_builder.data_root=/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval
      - scenario_builder.sensor_root=/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/sensor_blobs
      - scenario_filter=val14
      - scenario_filter.remove_invalid_goals=false

# Critic model kwargs (HorizonCritic). Must match the trained checkpoint.
# Used by train.py and by evaluate.py (scorer=critic). The scene_encoder is
# supplied at runtime (from the planner), not from here.
critic:
  horizon: 80            # candidate trajectory length (time-embedding table size)
  state_dim: 4           # per-step candidate state dim
  encoder_hidden: 192    # FlowPlanner scene-token dim
  d_model: 192
  nhead: 6
  num_layers: 2
  dim_feedforward: 512
  dropout: 0.0
  use_delta: true        # append step-deltas (velocity) to candidate features

evaluate:
  scorer: candidate0        # candidate0 | random | critic
  num_candidates: 16        # candidates the scorer ranks each step
  episodes: 1118            # cap on scenarios (val14 has 1118)
  workers: 8
  cpus_per_worker: 1.0
  gpus_per_worker: 0.125
  # critic scorer only:
  visible_horizon: null     # how many candidate steps the critic sees (e.g. 10)
  checkpoint: null          # path to a trained critic checkpoint (.pt with a "critic" key)
  q_reduction: mean         # mean | min  (how to combine twin heads, if used)
  output_dir: /tmp/eval/results
