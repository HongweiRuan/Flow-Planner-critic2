# ============================================================================
# DATA COLLECTION config  (used by:  python collect.py --config config/collect.yaml)
#
# Rolls out the Flow-Planner on the nuPlan *trainval* split, N=16 candidates per
# decision, and saves transitions to a replay buffer for critic training.
# Everything is in ONE file -- edit paths here, no hidden inheritance.
#
# All paths below are for the RNG cluster. To move clusters, edit:
#   factory.kwargs.config_dir / data_root / maps_root
#   the planner config_path / ckpt_path overrides
#   scenario_builder.data_root / db_files / sensor_root overrides
# ============================================================================
seed: 17
ray: {address: null}          # null = start a local Ray; set to a cluster address to attach

factory:
  # module:attribute that builds the nuPlan env (planner + simulator).
  path: flow_planner.critic_rl.factory:NuPlanHydraFactory
  kwargs:
    config_dir: /fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/special/tfx-901/ruh1syv/nuplan-devkit/nuplan/planning/script/config/simulation
    num_candidates: 16
    base_seed: 17
    max_steps: null           # null = run each scenario to its natural end
    data_root: /fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset
    maps_root: /fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/maps
    output_dir: /tmp/collect/nuplan
    exp_root: /tmp/collect
    # hydra overrides passed to nuPlan's default_simulation config.
    overrides:
      - +simulation=closed_loop_nonreactive_agents
      - planner=flow_planner
      - planner.flow_planner.config_path=/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/special/tfx-901/ruh1syv/ckpts/flow-planner/model_config.yaml
      - planner.flow_planner.ckpt_path=/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/special/tfx-901/ruh1syv/flowplanner-repro/outputs/full_h200_everyepoch/model_epoch_50_trainloss_0.0160.pth
      - scenario_builder=nuplan
      - scenario_builder.data_root=/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval
      - scenario_builder.db_files=[/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_00008_00083.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_00095_00555.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_00566_00754.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_00765_01072.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_01102_01213.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_01224_01328.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_01412_01652.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_01710_01858.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_01884_01991.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_02002_02116.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_02127_02272.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.11.59.52_veh-35_02283_02464.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.12.01.13_veh-47_00093_00572.db,/fs/scratch/rb-bd-dlp-rng-dl01-cr-tfx/datasets/public/nuplan/dataset/nuplan-v1.1/splits/trainval/2021.06.07.12.01.13_veh-47_00624_00689.db,/fs/scratch/rb-bd-d