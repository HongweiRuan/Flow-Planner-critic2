      - scenario_filter.limit_total_scenarios=150

# Replay buffer written by collect.py. `collect.py` appends `_h<K>` to the stem
# (one buffer per execution horizon K), so different K never collide.
# Each transition stores the scene ENCODER INPUTS (re-encodable / re-inferenceable)
# + the executed action trajectory -- NOT the frozen scene tokens. Tensor shapes
# are inferred from the data, so only capacity is needed here.
replay:
  path: /tmp/collect/replay.zarr
  overwrite: true
  spec: {capacity: 130000}

# How much to collect and with how many parallel Ray actors.
collect:
  execution_horizon: 1      # sim steps committed per decision (the "K" you're collecting for)
  target: 10000             # stop once the buffer holds this many transitions
  workers: 64               # parallel CollectorWorker actors
  cpus_per_worker: 0.3
  gpus_per_worker: 0.125
